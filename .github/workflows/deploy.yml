name: DevOps IaC & Deployment Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Provision Infrastructure & Deploy App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Terraform Init & Apply
        run: |
          cd terraform
          terraform init
          terraform apply -auto-approve

      - name: Setup SSH Key for Ansible
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/Wira_Keys.pem
          chmod 600 ~/.ssh/Wira_Keys.pem

      - name: Run Ansible Setup & Deployment
        run: |
          sudo apt update && sudo apt install -y ansible
          cd ansible
          ansible-playbook playbooks/setup-ec2.yml
          ansible-playbook playbooks/deploy-app.yml
